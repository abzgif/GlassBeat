name: Build & Release GlassBeat macOS

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Application (.dmg & .app)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Compile macOS CoreAudio Helper (Swift)
        run: |
          chmod +x gradlew run_macos.sh
          swiftc -O -whole-module-optimization \
            composeApp/src/desktopMain/resources/macos/GlassBeatAudioHelper.swift \
            -o composeApp/src/desktopMain/resources/macos/glassbeat-audio-helper
          strip -S -x composeApp/src/desktopMain/resources/macos/glassbeat-audio-helper
          chmod +x composeApp/src/desktopMain/resources/macos/glassbeat-audio-helper

      - name: Build macOS App Bundle
        run: |
          ./gradlew :composeApp:createDistributable --no-daemon

      - name: Apply Official GlassBeat Icon, Strip Debug Symbols & Package Compact DMG + ZIP
        run: |
          APP_DIR=$(find composeApp/build/compose/binaries/main/app -maxdepth 1 -name "*.app" | head -n 1)
          if [[ -z "$APP_DIR" ]]; then
            echo "Error: GlassBeat.app not found!"
            exit 1
          fi

          # 1. Ensure GlassBeat.icns is installed in Contents/Resources and replaces any default icon
          cp -f composeApp/src/desktopMain/resources/GlassBeat.icns "$APP_DIR/Contents/Resources/GlassBeat.icns"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile GlassBeat.icns" "$APP_DIR/Contents/Info.plist" || true

          # 2. Reduce app size: strip debug symbols from all native .dylib libraries & remove legal/man docs
          find "$APP_DIR" -type f \( -name "*.dylib" -o -name "*.jnilib" \) -exec strip -S -x {} + 2>/dev/null || true
          rm -rf "$APP_DIR/Contents/runtime/Contents/Home/legal" "$APP_DIR/Contents/runtime/Contents/Home/man" 2>/dev/null || true

          # 3. Re-sign the optimized app bundle with ad-hoc signature so macOS caches the proper icon
          touch "$APP_DIR"
          codesign --force --deep --sign - "$APP_DIR"

          # 4. Create output directory and package compact ZIP + high-compression DMG (zlib-level=9)
          OUT_DIR="composeApp/build/compose/binaries/main/dmg"
          mkdir -p "$OUT_DIR"

          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "$OUT_DIR/GlassBeat-macOS-app.zip"

          DMG_STAGE="/tmp/glassbeat_dmg_stage"
          rm -rf "$DMG_STAGE"
          mkdir -p "$DMG_STAGE"
          cp -R "$APP_DIR" "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"

          hdiutil create -volname "GlassBeat" \
            -srcfolder "$DMG_STAGE" \
            -ov -format UDZO -imagekey zlib-level=9 \
            "$OUT_DIR/GlassBeat-1.1.5.dmg"

          ls -lh "$OUT_DIR/"

      - name: Upload macOS Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GlassBeat-macOS-Installer
          path: |
            composeApp/build/compose/binaries/main/dmg/*.dmg
            composeApp/build/compose/binaries/main/dmg/*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && 'v1.1.5' || github.ref_name }}
          name: GlassBeat macOS ${{ github.ref_name == 'main' && 'v1.1.5' || github.ref_name }}
          body: |
            ### GlassBeat for macOS
            - Native macOS Compose for Desktop build with CoreAudio 5-Band Parametric Equalizer (`AVAudioEngine` + `AVAudioUnitEQ` + `AVAudioUnitTimePitch`).
            - Download **GlassBeat-1.1.5.dmg** below to install, or use **Settings → Check for Updates** inside the app to update and reopen automatically.
          files: |
            composeApp/build/compose/binaries/main/dmg/*.dmg
            composeApp/build/compose/binaries/main/dmg/*.zip
          draft: false
          prerelease: false
