name: Build & Release GlassBeat (macOS, Windows, Linux)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (.dmg & .app)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Compile macOS CoreAudio Helper (Swift)
        run: |
          chmod +x gradlew run_macos.sh
          swiftc -O composeApp/src/desktopMain/resources/macos/GlassBeatAudioHelper.swift \
            -o composeApp/src/desktopMain/resources/macos/glassbeat-audio-helper
          chmod +x composeApp/src/desktopMain/resources/macos/glassbeat-audio-helper

      - name: Build macOS DMG & App Bundle
        run: |
          ./gradlew :composeApp:packageDmg :composeApp:createDistributable --no-daemon

      - name: Package .app as ZIP for OTA Auto-Update
        run: |
          APP_DIR=$(find composeApp/build/compose/binaries/main/app -maxdepth 1 -name "*.app" | head -n 1)
          if [[ -n "$APP_DIR" ]]; then
            cp -f composeApp/src/desktopMain/resources/GlassBeat.icns "$APP_DIR/Contents/Resources/GlassBeat.icns" || true
            ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" composeApp/build/compose/binaries/main/dmg/GlassBeat-macOS-app.zip
          fi
          ls -lh composeApp/build/compose/binaries/main/dmg/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GlassBeat-macOS-Installer
          path: |
            composeApp/build/compose/binaries/main/dmg/*.dmg
            composeApp/build/compose/binaries/main/dmg/*.zip

  build-windows:
    name: Build Windows (.msi, .exe & portable .zip)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install WiX Toolset for Windows Installers
        shell: pwsh
        run: |
          choco install wixtoolset --yes --no-progress
          $wixPath = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          if (Test-Path $wixPath) {
            echo "$wixPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build Windows Installers & Portable Distributable
        shell: pwsh
        run: |
          # Try building MSI/EXE installers with WiX
          try {
            ./gradlew.bat :composeApp:packageMsi :composeApp:packageExe --no-daemon
          } catch {
            Write-Warning "packageMsi/packageExe failed or WiX not found, proceeding with portable package"
          }
          # Always build portable standalone directory
          ./gradlew.bat :composeApp:createDistributable --no-daemon
          
          # Zip the standalone portable app
          $appDir = "composeApp/build/compose/binaries/main/app/GlassBeat"
          if (Test-Path $appDir) {
            $zipOut = "composeApp/build/compose/binaries/main/GlassBeat-Windows-portable.zip"
            Compress-Archive -Path "$appDir\*" -DestinationPath $zipOut -Force
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GlassBeat-Windows-Installer
          path: |
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/exe/*.exe
            composeApp/build/compose/binaries/main/*.zip

  build-linux:
    name: Build Linux (.deb, .rpm & portable .tar.gz)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Packaging Tools & Audio Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm libasound2-dev libx11-dev libxext-dev libxi-dev libxtst-dev

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Linux DEB, RPM & Portable Tarball
        run: |
          chmod +x gradlew
          # Build DEB and RPM packages
          ./gradlew :composeApp:packageDeb :composeApp:packageRpm --no-daemon || true
          # Always build portable standalone distributable
          ./gradlew :composeApp:createDistributable --no-daemon
          
          # Create standalone tar.gz archive
          if [[ -d "composeApp/build/compose/binaries/main/app/glassbeat" ]]; then
            tar -czf "composeApp/build/compose/binaries/main/GlassBeat-Linux-portable.tar.gz" \
              -C "composeApp/build/compose/binaries/main/app" glassbeat
          elif [[ -d "composeApp/build/compose/binaries/main/app/GlassBeat" ]]; then
            tar -czf "composeApp/build/compose/binaries/main/GlassBeat-Linux-portable.tar.gz" \
              -C "composeApp/build/compose/binaries/main/app" GlassBeat
          fi

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GlassBeat-Linux-Installer
          path: |
            composeApp/build/compose/binaries/main/deb/*.deb
            composeApp/build/compose/binaries/main/rpm/*.rpm
            composeApp/build/compose/binaries/main/*.tar.gz

  publish-release:
    name: Publish Multi-OS GitHub Release
    needs: [ build-macos, build-windows, build-linux ]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Download All Platform Installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: ls -lh release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GlassBeat Desktop ${{ github.ref_name }} (macOS, Windows, Linux)
          body: |
            ### GlassBeat Desktop ${{ github.ref_name }}
            Cross-platform glassmorphic music player and 5-band parametric equalizer for **macOS**, **Windows**, and **Linux**.

            #### Downloads by Platform
            - **macOS (Apple Silicon & Intel / macOS 12+)**:
              - Download **`.dmg`** installer
              - Or download **`GlassBeat-macOS-app.zip`** (direct .app bundle)
            - **Windows (Windows 10 / 11 64-bit)**:
              - Download **`.msi`** or **`.exe`** installer
              - Or download **`GlassBeat-Windows-portable.zip`** (extract and run `GlassBeat.exe` without installation)
            - **Linux (Ubuntu / Debian / Fedora / Arch 64-bit)**:
              - Download **`.deb`** (Ubuntu / Debian / Mint)
              - Download **`.rpm`** (Fedora / RHEL / openSUSE)
              - Or download **`GlassBeat-Linux-portable.tar.gz`** (extract and run directly on any Linux distribution)
            - **Android**:
              - Available on [Google Play](https://play.google.com/store/apps/details?id=com.bytegif.glassbeat)
            - **OTA Auto-Update**:
              - Existing desktop users can update directly from **Settings → Check for Updates**.
          files: |
            release-assets/*
          draft: false
          prerelease: false
